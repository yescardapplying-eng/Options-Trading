<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48">
  <defs>
    <linearGradient id="logoEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Icon Emblem -->
  <g transform="translate(4, 4)">
    <rect width="40" height="40" rx="10" fill="#222831" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" />
    <path d="M10 20 C10 14.5 14.5 10 20 10 C25.5 10 30 14.5 30 20 C30 25.5 25.5 30 20 30" fill="none" stroke="url(#logoEmerald)" stroke-width="2.5" stroke-linecap="round" filter="url(#logoGlow)" />
    <polyline points="15 24 20 17 24 20 29 13" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="29" cy="13" r="2" fill="#10B981" />
  </g>
  <!-- Brand Typography -->
  <text x="56" y="24" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="19" font-weight="800" letter-spacing="-0.02em">Options</text>
  <text x="135" y="24" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="19" font-weight="800" letter-spacing="-0.02em">Trading</text>
  <text x="56" y="37" fill="#A7B0BE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="9.5" font-weight="600" letter-spacing="0.12em" text-transform="uppercase">FINTECH ADVISORY</text>
</svg>
